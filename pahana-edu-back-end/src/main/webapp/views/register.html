<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <title>Register</title>
  <link rel="stylesheet" href="./styles/register.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .register-card {
      background-color: #ffffff;
      border-radius: 0.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    .brand-title {
      font-weight: 700;
      color: #0d6efd;
    }
    .form-floating {
      margin-bottom: 1rem;
    }
    .login-link {
      color: #0d6efd;
      text-decoration: none;
    }
    .login-link:hover {
      text-decoration: underline;
    }
    .show-password {
      cursor: pointer;
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>
<body>
<main class="container">
  <div class="register-card mx-auto">
    <div class="text-center mb-4">
      <h1 class="brand-title">Create Account</h1>
    </div>
    <form id="registerForm">
      <div class="form-floating">
        <input type="text" class="form-control" id="floatingName" placeholder="Full Name" aria-label="Full Name" required>
        <label for="floatingName">Full Name</label>
      </div>
      <div class="form-floating">
        <input type="text" class="form-control" id="floatingAccountNo" placeholder="Account Number" aria-label="Account Number" required>
        <label for="floatingAccountNo">Account Number</label>
      </div>
      <div class="form-floating">
        <input type="tel" class="form-control" id="floatingTel" placeholder="Telephone Number" aria-label="Telephone Number" required>
        <label for="floatingTel">Telephone Number</label>
      </div>
      <div class="form-floating">
        <textarea class="form-control" id="floatingAddress" placeholder="Address" style="height: 100px" aria-label="Address" required></textarea>
        <label for="floatingAddress">Address</label>
      </div>
      <div class="form-floating position-relative">
        <input type="password" class="form-control" id="floatingPassword" placeholder="Password" aria-label="Password" required>
        <label for="floatingPassword">Password</label>
        <i class="bi bi-eye-slash show-password" id="togglePassword"></i>
      </div>
      <div class="form-floating position-relative">
        <input type="password" class="form-control" id="floatingConfirmPassword" placeholder="Confirm Password" aria-label="Confirm Password" required>
        <label for="floatingConfirmPassword">Confirm Password</label>
        <i class="bi bi-eye-slash show-password" id="toggleConfirmPassword"></i>
      </div>
      <button class="w-100 btn btn-primary mt-3" type="submit">Register</button>
      <div class="mt-4 text-center">
        <p>Already have an account? <a href="../index.html" class="login-link">Sign in</a></p>
      </div>
      <div id="message" class="mt-3"></div>
    </form>
  </div>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
<script src="js/Register.js"></script>
</body>
</html>
