<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background-color: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .brand-title {
            font-weight: 700;
            color: #0d6efd;
        }
        .form-floating {
            margin-bottom: 1rem;
        }
        .register-link {
            color: #0d6efd;
            text-decoration: none;
        }
        .register-link:hover {
            text-decoration: underline;
        }
        .show-password {
            cursor: pointer;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>
<main class="container">
    <div class="login-card mx-auto">
        <div class="text-center mb-4">
            <h1 class="brand-title">Sign In</h1>
        </div>
        <form id="loginForm">
            <div class="form-floating position-relative">
                <input type="text" class="form-control" id="userName" placeholder="User Name" aria-label="User Name" required>
                <label for="userName">User Name</label>
            </div>
            <div class="form-floating position-relative">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password" aria-label="Password" required>
                <label for="floatingPassword">Password</label>
                <i class="bi bi-eye-slash show-password" id="togglePassword"></i>
            </div>
            <div class="form-check mb-3 text-start">
                <input class="form-check-input" type="checkbox" value="remember-me" id="rememberMe" aria-label="Remember me">
                <label class="form-check-label" for="rememberMe">
                    Remember me
                </label>
            </div>
            <button class="w-100 btn btn-primary" id="btnSignIn" type="button">Sign in</button>
            <div class="mt-4 text-center">
                <p>Don't have an account? <a href="views/register.html" class="register-link">Register now</a></p>
            </div>
            <div id="message" class="mt-3"></div>
        </form>
    </div>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
<script>
    $(document).ready(function () {
        // Toggle password visibility
        $("#togglePassword").click(function () {
            const passwordField = $("#floatingPassword");
            const type = passwordField.attr("type") === "password" ? "text" : "password";
            passwordField.attr("type", type);
            $(this).toggleClass("bi-eye bi-eye-slash");
        });

        // Form submission
        $("#btnSignIn").click(function (e) {
            e.preventDefault();

            // Simple validation
            const username = $("#userName").val().trim();
            const password = $("#floatingPassword").val();

            // Clear previous error messages
            $('.form-control').removeClass('is-invalid');
            $('.invalid-feedback').remove();
            $("#message").empty();

            let hasErrors = false;

            // Validate username
            if (!username) {
                showFieldError('#userName', 'Username is required');
                hasErrors = true;
            } else if (username.length < 3) {
                showFieldError('#userName', 'Username must be at least 3 characters long');
                hasErrors = true;
            }

            // Validate password
            if (!password) {
                showFieldError('#floatingPassword', 'Password is required');
                hasErrors = true;
            } else if (password.length < 6) {
                showFieldError('#floatingPassword', 'Password must be at least 6 characters long');
                hasErrors = true;
            }

            if (hasErrors) {
                return;
            }

            const loginData = {
                username: username,
                password: password
            };
            $.ajax({
                type: "POST",
                url: "http://localhost:8080/pahana/login", // Placeholder URL
                contentType: "application/json",
                data: JSON.stringify(loginData),
                success: function (response) {
                    localStorage.setItem("userRole", response.role);
                    $("#message").html(`
                        <div class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
                            <div class="d-flex">
                                <div class="toast-body">
                                    ${response.message}
                                </div>
                                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                            </div>
                        </div>
                    `);
                    // Initialize and show the toast
                    const toastElement = $("#message .toast");
                    const toast = new bootstrap.Toast(toastElement[0], { delay: 1000 });
                    toast.show();
                    $("#loginForm")[0].reset();
                    setTimeout(() => {
                        window.location.href = "dashboard.html?fresh=true" // Redirect to dashboard with fresh login flag
                    }, 1000);
                },
                error: function () {
                    $("#message").html(`<div class="alert alert-danger">Error logging in.</div>`);
                }
            });
        });

        // Helper function to show field validation errors
        function showFieldError(fieldSelector, message) {
            const $field = $(fieldSelector);
            $field.addClass('is-invalid');
            $field.after('<div class="invalid-feedback">' + message + '</div>');
        }
    });
</script>
</body>
</html>
